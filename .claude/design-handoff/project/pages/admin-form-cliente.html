<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/shell.css">
<script src="../assets/icons.js"></script><script src="../assets/tweaks.js"></script><script src="../assets/sidebar.js"></script>
<style>
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
  .tab{padding:12px 20px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary)}
  .tab .ct{background:var(--surface-2);color:var(--muted);font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700}
  .tab.on .ct{background:var(--primary-50);color:var(--primary)}
  .panel{display:none}.panel.on{display:block;animation:fi .2s}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .two{display:grid;grid-template-columns:2fr 1fr;gap:24px}
  @media(max-width:1000px){.two{grid-template-columns:1fr}}
  .section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:24px;margin-bottom:20px;box-shadow:var(--sh-sm)}
  .section-card h3{font-size:15px;color:var(--ink-strong);margin-bottom:4px}
  .section-card .hint{color:var(--muted);font-size:13px;margin-bottom:18px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .f3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:700px){.f2,.f3{grid-template-columns:1fr}}
  .side{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;position:sticky;top:80px;height:fit-content}
  .side h4{font-size:12px;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:12px}
  .side .pic{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#dc2626);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:32px;margin:0 auto 14px}
  .side .row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:var(--ink);border-bottom:1px dashed var(--divider)}
  .side .row:last-child{border:0}
  .side .row b{color:var(--ink-strong);font-weight:700}

  /* Cards table */
  .card-list{display:flex;flex-direction:column;gap:12px}
  .ccard{position:relative;background:linear-gradient(135deg,#1a365d,#3182ce);color:#fff;border-radius:var(--r-md);padding:18px 20px;overflow:hidden}
  .ccard::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
  .ccard--gold{background:linear-gradient(135deg,#92400e,#d97706)}
  .ccard--black{background:linear-gradient(135deg,#0f172a,#334155)}
  .ccard__head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px;position:relative}
  .ccard__brand{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  .ccard__chip{width:36px;height:26px;background:linear-gradient(135deg,#fde68a,#f59e0b);border-radius:4px}
  .ccard__num{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.12em;font-weight:600;margin-bottom:14px;position:relative}
  .ccard__foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;position:relative}
  .ccard__foot small{opacity:.7;display:block;margin-bottom:2px;letter-spacing:.04em}
  .ccard__foot b{font-weight:700;letter-spacing:.04em}
  .ccard__net{font-size:18px;font-weight:800;font-style:italic;letter-spacing:-.02em}
  .ccard-actions{display:flex;gap:6px;margin-top:8px}

  .prog-list{display:flex;flex-direction:column;gap:10px}
  .prow{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--r-sm)}
  .prow .logo{width:40px;height:40px;border-radius:8px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .prow .info b{display:block;color:var(--ink-strong);font-size:14px}
  .prow .info small{color:var(--muted);font-size:12px}
  .prow .pts{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
</style></head><body>
