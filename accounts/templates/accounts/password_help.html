{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajuda de acesso - NCFly</title>
  <link rel="stylesheet" href="{% static 'gestao/css/login.css' %}">
</head>
<body class="login-page">
  <div class="login-background" aria-hidden="true">
    <span class="login-background__glow login-background__glow--blue"></span>
    <span class="login-background__glow login-background__glow--pink"></span>
    <span class="login-background__glow login-background__glow--gold"></span>
  </div>
  <main class="login-layout login-layout--single">
    <section class="login-card-wrap">
      <div class="login-card">
        <div class="login-card__header">
          <p class="login-card__eyebrow">Ajuda de acesso</p>
          <h1 class="login-card__title">Recuperar sua senha</h1>
          <p class="login-card__subtitle">O sistema ainda não possui redefinição automática de senha.</p>
        </div>
        <div class="login-alert" role="status">
          Entre em contato com o administrador da sua empresa para solicitar uma nova senha.
        </div>
        <div class="login-help-actions">
          <a href="{% url 'login_custom' %}" class="login-help-actions__secondary">Voltar ao login</a>
          <a href="{% url 'cliente_create' %}" class="login-help-actions__primary">Cadastre-se</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
