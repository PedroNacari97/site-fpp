<style>
  .subtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
  .st{padding:12px 18px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .st:hover{color:var(--ink)}
  .st.on{color:var(--primary);border-bottom-color:var(--primary)}
  .pn{display:none}.pn.on{display:block}

  /* Programas cards */
  .p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .p-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);position:relative}
  .p-card__top{padding:20px 22px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start}
  .p-card__top h4{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
  .p-card__top small{opacity:.85;font-size:12px}
  .p-card__body{padding:18px 22px}
  .p-card__big{font-size:32px;font-weight:800;color:var(--ink-strong);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .p-card__big small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
  .p-card__sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:12px}
  .p-card__row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;color:var(--muted)}
  .p-card__row b{color:var(--ink-strong);font-variant-numeric:tabular-nums}
  .p-card__foot{padding:12px 22px 16px;border-top:1px solid var(--divider);display:flex;gap:8px}

  /* Tables */
  .dt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm)}
  .dt table{width:100%;border-collapse:separate;border-spacing:0}
  .dt thead th{background:var(--surface-2);font-size:12px;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .dt thead th.num{text-align:right}
  .dt tbody td{padding:14px 16px;border-bottom:1px solid var(--divider);font-size:13.5px;color:var(--ink)}
  .dt tbody tr:hover td{background:var(--surface-hover)}
  .dt tbody td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-strong)}
  .code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--surface-2);padding:2px 7px;border-radius:4px;color:var(--ink-strong);font-weight:700}
  .pag{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar .left{display:flex;gap:10px;align-items:center;flex:1;flex-wrap:wrap}
  .toolbar .search{min-width:260px;flex:1;max-width:360px}

  /* Hotels gallery */
  .h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .h-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);transition:all .15s}
  .h-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
  .h-card__img{height:160px;background:linear-gradient(135deg,#fed8b1,#f9a26c);position:relative;display:flex;align-items:flex-end;padding:14px}
  .h-card__img.alt1{background:linear-gradient(135deg,#c3cfe2,#8392b0)}
  .h-card__img.alt2{background:linear-gradient(135deg,#ffecd2,#fcb69f)}
  .h-card__img.alt3{background:linear-gradient(135deg,#a1c4fd,#c2e9fb)}
  .h-card__img.alt4{background:linear-gradient(135deg,#fbc2eb,#a6c1ee)}
  .h-card__img .stars{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:4px 9px;border-radius:99px;font-weight:700}
  .h-card__img .name{color:#fff;font-weight:800;font-size:16px;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.3)}
  .h-card__body{padding:16px}
  .h-card__body .city{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:4px;margin-bottom:10px}
  .h-card__prices{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--divider)}
  .h-card__prices div{flex:1}
  .h-card__prices .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .h-card__prices .v{font-size:15px;font-weight:700;color:var(--ink-strong);font-variant-numeric:tabular-nums}

  /* Inativo state */
  .inativo{text-align:center;padding:80px 24px;background:var(--surface);border:2px dashed var(--border);border-radius:var(--r-lg)}
  .inativo .ic{width:72px;height:72px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--muted)}
  .inativo h3{font-size:22px;font-weight:800;color:var(--ink-strong);letter-spacing:-.01em;margin-bottom:8px}
  .inativo p{color:var(--muted);max-width:420px;margin:0 auto 20px;line-height:1.55;font-size:14px}
</style></head><body>

function switchTab(name){
  document.querySelectorAll('.st').forEach(x=>x.classList.toggle('on',x.dataset.s===name));
  document.querySelectorAll('.pn').forEach(x=>x.classList.toggle('on',x.dataset.p===name));
}
document.querySelectorAll('.st').forEach(s=>s.addEventListener('click',()=>switchTab(s.dataset.s)));
const urlTab=new URLSearchParams(location.search).get('tab');if(urlTab)switchTab(urlTab);
</script>
<script>
(function(){
  const root = document.documentElement;
  const topbar = document.querySelector('.topbar');
  if(!topbar) return;
  const btn = document.createElement('button');
  btn.className = 'btn btn--icon btn--ghost tt';
  btn.setAttribute('data-tt','Alternar tema');
  btn.setAttribute('aria-label','Alternar tema');
  btn.innerHTML = '<svg class="icon"><use id="dm-icon" href="#icon-moon"/></svg>';
  const spacer = topbar.querySelector('.spacer');
  if(spacer && spacer.nextSibling) topbar.insertBefore(btn, spacer.nextSibling); else topbar.appendChild(btn);
  const ic = btn.querySelector('#dm-icon');
  try { const t = JSON.parse(localStorage.getItem('nc_tweaks')||'{}'); if(t.dark) root.setAttribute('data-theme','dark'); } catch(e){}
  function sync(){
    const isDark = root.getAttribute('data-theme') === 'dark';
    ic.setAttribute('href', isDark ? '#icon-sun' : '#icon-moon');
  }
  sync();
  btn.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    try { const t = JSON.parse(localStorage.getItem('nc_tweaks')||'{}'); t.dark = !isDark; localStorage.setItem('nc_tweaks', JSON.stringify(t)); } catch(e){}
    sync();
  });
})();
</script>
