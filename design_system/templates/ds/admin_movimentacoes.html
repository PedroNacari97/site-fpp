<style>
  .subtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
  .st{padding:12px 18px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .st:hover{color:var(--ink)}
  .st.on{color:var(--primary);border-bottom-color:var(--primary)}
  .pn{display:none}.pn.on{display:block}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;box-shadow:var(--sh-sm)}
  .kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .kpi .v{font-size:26px;font-weight:800;color:var(--ink-strong);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .kpi .d{font-size:12px;color:var(--success);font-weight:600;margin-top:3px}
  .kpi .d.neg{color:var(--danger)}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar .left{display:flex;gap:10px;align-items:center;flex:1;flex-wrap:wrap}
  .toolbar .search{min-width:280px;flex:1;max-width:360px}

  .dt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm)}
  .dt table{width:100%;border-collapse:separate;border-spacing:0}
  .dt thead th{background:var(--surface-2);font-size:12px;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .dt thead th.num{text-align:right}
  .dt tbody td{padding:13px 16px;border-bottom:1px solid var(--divider);font-size:13.5px;color:var(--ink);vertical-align:middle}
  .dt tbody tr:hover td{background:var(--surface-hover)}
  .dt tbody td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-strong)}
  .code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--surface-2);padding:2px 7px;border-radius:4px;color:var(--ink-strong);font-weight:700}
  .pag{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
  .swap-arrow{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}

  /* Calculator */
  .calc{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .calc-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:22px;box-shadow:var(--sh-sm)}
  .calc-col h3{font-size:14px;font-weight:700;color:var(--ink-strong);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .calc-col label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;margin-top:10px;text-transform:uppercase;letter-spacing:.04em}
  .calc-col label:first-of-type{margin-top:0}
  .calc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;padding:14px 0;border-bottom:1px dashed var(--divider)}
  .calc-row:last-child{border-bottom:0}
  .calc-row .n{font-size:20px;font-weight:800;color:var(--ink-strong);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .calc-row .n small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-left:4px}
  .calc-result{background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);color:#fff;padding:20px;border-radius:var(--r-sm);margin-top:14px}
  .calc-result .l{font-size:12px;opacity:.9;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .calc-result .v{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
  .calc-result small{opacity:.9;font-size:12.5px}
</style></head><body>

function switchTab(name){
  document.querySelectorAll('.st').forEach(x=>x.classList.toggle('on',x.dataset.s===name));
  document.querySelectorAll('.pn').forEach(x=>x.classList.toggle('on',x.dataset.p===name));
}
document.querySelectorAll('.st').forEach(s=>s.addEventListener('click',()=>switchTab(s.dataset.s)));
const urlTab=new URLSearchParams(location.search).get('tab');if(urlTab)switchTab(urlTab);

<script>
// Dark mode toggle no topbar do shell
(function(){
  const root = document.documentElement;
  const topbar = document.querySelector('.topbar');
  if(!topbar) return;
  const btn = document.createElement('button');
  btn.className = 'btn btn--icon btn--ghost tt';
  btn.setAttribute('data-tt','Alternar tema');
  btn.setAttribute('aria-label','Alternar tema');
  btn.innerHTML = '<svg class="icon"><use id="dm-icon" href="#icon-moon"/></svg>';
  const spacer = topbar.querySelector('.spacer');
  if(spacer && spacer.nextSibling) topbar.insertBefore(btn, spacer.nextSibling); else topbar.appendChild(btn);
  const ic = btn.querySelector('#dm-icon');
  try { const t = JSON.parse(localStorage.getItem('nc_tweaks')||'{}'); if(t.dark) root.setAttribute('data-theme','dark'); } catch(e){}
  function sync(){
    const isDark = root.getAttribute('data-theme') === 'dark';
    ic.setAttribute('href', isDark ? '#icon-sun' : '#icon-moon');
  }
  sync();
  btn.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    try { const t = JSON.parse(localStorage.getItem('nc_tweaks')||'{}'); t.dark = !isDark; localStorage.setItem('nc_tweaks', JSON.stringify(t)); } catch(e){}
    sync();
  });
})();
</script>
