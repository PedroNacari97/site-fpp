<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emissao {{ emissao.id }}</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
        }

        html {
            font-size: 10.6px;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .pdf-preview-document {
            width: 210mm;
            min-height: 297mm;
            padding: 6.5mm;
            background: #ffffff;
            overflow: visible;
        }

        .pdf-preview-document .quote-preview-page {
            max-width: none;
            margin: 0;
            transform: scale(0.89);
            transform-origin: top left;
            width: calc(100% / 0.89);
        }

        .pdf-preview-document .quote-preview__back-link {
            display: none !important;
        }

{{ inline_css|safe }}

        @page {
            size: A4 portrait;
            margin: 0 !important;
        }

        .pdf-preview-document a {
            color: inherit;
            text-decoration: none;
        }

        .pdf-preview-document a[href]::after {
            content: none !important;
        }

        .pdf-preview-document .quote-preview-sheet,
        .pdf-preview-document .emission-preview-sheet {
            border-radius: 18px !important;
            overflow: visible !important;
            box-shadow: none !important;
        }

        .pdf-preview-document .quote-preview-hero {
            gap: 0.9rem;
            padding: 0.95rem 1rem;
        }

        .pdf-preview-document .emission-preview-hero__mark,
        .pdf-preview-document .quote-preview-hero__mark {
            width: 2.35rem;
            height: 2.35rem;
            border-radius: 0.8rem;
        }

        .pdf-preview-document .quote-preview-hero__logo-box {
            width: 136px;
            min-width: 136px;
            height: 40px;
            padding: 0.34rem 0.5rem;
            border-radius: 0.82rem;
        }

        .pdf-preview-document .quote-preview-hero__logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .pdf-preview-document .quote-preview-hero__brand h2 {
            font-size: 1.18rem;
        }

        .pdf-preview-document .quote-preview-hero__brand p {
            font-size: 0.76rem;
        }

        .pdf-preview-document .emission-preview-hero__summary {
            gap: 0.55rem;
            min-width: 150px;
        }

        .pdf-preview-document .emission-preview-hero__badge,
        .pdf-preview-document .emission-preview-hero__status {
            padding: 0.65rem 0.75rem;
            border-radius: 0.8rem;
        }

        .pdf-preview-document .emission-preview-hero__badge strong {
            font-size: 1.5rem;
        }

        .pdf-preview-document .quote-preview-meta {
            gap: 0.65rem;
            padding: 0.8rem 1rem 0.9rem;
        }

        .pdf-preview-document .quote-preview-section {
            padding: 0.82rem 1rem;
        }

        .pdf-preview-document .quote-preview-section__heading {
            gap: 0.5rem;
            margin-bottom: 0.7rem;
        }

        .pdf-preview-document .quote-preview-section__heading h3,
        .pdf-preview-document .quote-preview-section__title-only {
            font-size: 0.92rem;
        }

        .pdf-preview-document .quote-preview-section__icon {
            width: 1.65rem;
            height: 1.65rem;
        }

        .pdf-preview-document .emission-preview-passengers,
        .pdf-preview-document .emission-preview-flights,
        .pdf-preview-document .quote-preview-values,
        .pdf-preview-document .quote-preview-list {
            gap: 0.62rem;
        }

        .pdf-preview-document .emission-preview-passenger-card,
        .pdf-preview-document .emission-preview-baggage-card,
        .pdf-preview-document .quote-preview-alert,
        .pdf-preview-document .quote-preview-value-row,
        .pdf-preview-document .emission-preview-total-card {
            border-radius: 0.82rem;
        }

        .pdf-preview-document .emission-preview-passenger-card {
            padding: 0.9rem 0.95rem;
        }

        .pdf-preview-document .emission-preview-passenger-card__header {
            margin-bottom: 0.7rem;
        }

        .pdf-preview-document .emission-preview-passenger-card__header h4 {
            font-size: 1rem;
        }

        .pdf-preview-document .emission-preview-passenger-card__badge {
            padding: 0.28rem 0.58rem;
            font-size: 0.68rem;
        }

        .pdf-preview-document .emission-preview-passenger-card__grid {
            gap: 0.6rem;
        }

        .pdf-preview-document .emission-preview-flight-card__header {
            padding: 0.82rem 0.95rem;
        }

        .pdf-preview-document .emission-preview-flight-card__route {
            gap: 0.8rem;
            padding: 0.9rem 0.95rem 0.75rem;
        }

        .pdf-preview-document .emission-preview-flight-stop b {
            font-size: 1.4rem;
        }

        .pdf-preview-document .emission-preview-flight-divider {
            min-width: 128px;
            font-size: 0.72rem;
        }

        .pdf-preview-document .emission-preview-flight-divider::before,
        .pdf-preview-document .emission-preview-flight-divider::after {
            width: 42px;
        }

        .pdf-preview-document .emission-preview-flight-stop--right {
            justify-self: end;
            width: 100%;
            text-align: right;
        }

        .pdf-preview-document .emission-preview-flight-card__cta {
            min-height: 34px;
            margin: 0 0.95rem 0.75rem;
            border-radius: 0.65rem;
            font-size: 0.76rem;
        }

        .pdf-preview-document .emission-preview-flight-card__scales {
            gap: 0.65rem;
            padding: 0 0.95rem 0.9rem;
        }

        .pdf-preview-document .emission-preview-flight-card__scale {
            padding: 0.72rem 0.8rem;
            border-radius: 0.75rem;
        }

        .pdf-preview-document .quote-preview-value-row {
            padding: 0.72rem 0.82rem;
        }

        .pdf-preview-document .emission-preview-total-card {
            margin-top: 0.75rem;
            padding: 0.9rem 1rem;
        }

        .pdf-preview-document .emission-preview-total-card strong {
            font-size: 1.55rem;
        }

        .pdf-preview-document .quote-preview-list li {
            line-height: 1.45;
        }

        .pdf-preview-document .quote-preview-contact {
            gap: 0.65rem;
            padding: 0.82rem 1rem;
        }

        .pdf-preview-document .quote-preview-contact--with-watermark {
            padding-left: 5.6rem;
        }

        .pdf-preview-document .quote-preview-contact__watermark {
            left: 0.92rem;
            bottom: 0.68rem;
            width: 76px;
            max-width: 76px;
        }
    </style>
</head>
<body>
    <div class="pdf-preview-document">
        <div class="quote-preview-page emission-preview-page quote-preview-page--print-mode">
            {% include "admin_custom/partials/emissao_preview_sheet.html" %}
        </div>
    </div>
</body>
</html>
