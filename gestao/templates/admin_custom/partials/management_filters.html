<section class="rounded border border-gray-700 bg-gray-800 p-6">
  <form method="get" class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">
    {% if empresa_id %}<input type="hidden" name="empresa_id" value="{{ empresa_id }}">{% endif %}
    <div><label for="data_inicio" class="mb-2 block text-sm text-gray-300">Data inicial</label><input id="data_inicio" type="date" name="data_inicio" value="{{ management_dashboard.start_date }}" class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-gray-200"></div>
    <div><label for="data_fim" class="mb-2 block text-sm text-gray-300">Data final</label><input id="data_fim" type="date" name="data_fim" value="{{ management_dashboard.end_date }}" class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-gray-200"></div>
    <div><label for="cliente" class="mb-2 block text-sm text-gray-300">Cliente</label><select id="cliente" name="cliente" class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-gray-200"><option value="">Todos</option>{% for item in management_dashboard.filter_options.clientes %}<option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>{% endfor %}</select></div>
    <div><label for="conta" class="mb-2 block text-sm text-gray-300">Conta</label><select id="conta" name="conta" class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-gray-200"><option value="">Todas</option>{% for item in management_dashboard.filter_options.contas %}<option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>{% endfor %}</select></div>
    <div><label for="programa" class="mb-2 block text-sm text-gray-300">Programa</label><select id="programa" name="programa" class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-gray-200"><option value="">Todos</option>{% for item in management_dashboard.filter_options.programas %}<option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>{% endfor %}</select></div>
    <div><label for="status_home" class="mb-2 block text-sm text-gray-300">Status</label><select id="status_home" name="status" class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-gray-200"><option value="">Todos</option><option value="pendente" {% if management_dashboard.selected_status == 'pendente' %}selected{% endif %}>Pendente</option><option value="emitido" {% if management_dashboard.selected_status == 'emitido' %}selected{% endif %}>Emitido</option></select></div>
    <div><label for="emissor" class="mb-2 block text-sm text-gray-300">Emissor</label><select id="emissor" name="emissor" class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-gray-200"><option value="">Todos</option>{% for item in management_dashboard.filter_options.emissores %}<option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>{% endfor %}</select></div>
    <div class="xl:col-span-4 flex items-end gap-3"><button type="submit" class="rounded bg-blue-600 px-6 py-3 text-white hover:bg-blue-700">Aplicar</button><a href="?{{ management_dashboard.clear_filters_query }}" class="rounded border border-gray-700 bg-gray-900 px-6 py-3 text-gray-300">Limpar</a></div>
  </form>
</section>
