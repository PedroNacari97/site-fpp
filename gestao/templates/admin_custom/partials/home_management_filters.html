<form method="get" class="home-ops__filter-grid">
  {% if empresa_id %}<input type="hidden" name="empresa_id" value="{{ empresa_id }}">{% endif %}
  <div class="home-ops__field">
    <label for="data_inicio">Data inicial</label>
    <input id="data_inicio" type="date" name="data_inicio" value="{{ management_dashboard.start_date }}">
  </div>
  <div class="home-ops__field">
    <label for="data_fim">Data final</label>
    <input id="data_fim" type="date" name="data_fim" value="{{ management_dashboard.end_date }}">
  </div>
  <div class="home-ops__field">
    <label for="cliente">Cliente</label>
    <select id="cliente" name="cliente">
      <option value="">--</option>
      {% for item in management_dashboard.filter_options.clientes %}
        <option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="home-ops__field">
    <label for="conta">Conta</label>
    <select id="conta" name="conta">
      <option value="">--</option>
      {% for item in management_dashboard.filter_options.contas %}
        <option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="home-ops__field">
    <label for="programa">Programa</label>
    <select id="programa" name="programa">
      <option value="">--</option>
      {% for item in management_dashboard.filter_options.programas %}
        <option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="home-ops__field">
    <label for="status_home">Status</label>
    <select id="status_home" name="status">
      <option value="">--</option>
      <option value="pendente" {% if management_dashboard.selected_status == 'pendente' %}selected{% endif %}>Pendente</option>
      <option value="emitido" {% if management_dashboard.selected_status == 'emitido' %}selected{% endif %}>Emitido</option>
    </select>
  </div>
  <div class="home-ops__field">
    <label for="emissor">Emissor</label>
    <select id="emissor" name="emissor">
      <option value="">--</option>
      {% for item in management_dashboard.filter_options.emissores %}
        <option value="{{ item.id }}" {% if item.selected %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="home-ops__button">Aplicar</button>
  <a href="?{{ management_dashboard.clear_filters_query }}" class="home-ops__button-secondary">Limpar</a>
</form>
