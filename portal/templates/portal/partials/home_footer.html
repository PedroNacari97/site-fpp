<footer class="portal-footer portal-footer--home">
    <div class="portal-footer__panel">
        <div class="portal-footer__panel-inner portal-footer__panel-inner--home">
            <div class="portal-footer__brand-block portal-footer__brand-block--home">
                <a href="{% url 'portal_home' %}" class="portal-footer__title-link">NC Fly News</a>
                <p>Seu portal de milhas, pontos e viagens com as melhores ofertas e not&iacute;cias.</p>
            </div>

            <div class="portal-footer__column portal-footer__column--home">
                <h3>Categorias</h3>
                <a href="{% url 'portal_categoria' 'milhas-e-pontos' %}">Milhas &amp; Pontos</a>
                <a href="{% url 'portal_categoria' 'hoteis-resorts' %}">Hot&eacute;is &amp; Resorts</a>
            </div>

            <div class="portal-footer__column portal-footer__column--home">
                <h3>Sobre</h3>
                <a href="{% url 'portal_sobre' %}">Quem Somos</a>
                {% if portal_contact_email %}
                <a href="mailto:{{ portal_contact_email }}">Contato</a>
                {% else %}
                <a href="{% url 'portal_sobre' %}">Contato</a>
                {% endif %}
                <a href="{% url 'portal_privacidade' %}">Pol&iacute;tica de Privacidade</a>
                <button type="button" class="portal-footer__link-button" data-cookie-open-preferences>Prefer&ecirc;ncias de cookies</button>
            </div>

        </div>
    </div>
    <div class="portal-footer__bar">
        <div class="portal-footer__bar-inner portal-footer__bar-inner--home">
            <span>&copy; {% now "Y" %} NC Fly. Todos os direitos reservados.</span>
        </div>
    </div>
</footer>
